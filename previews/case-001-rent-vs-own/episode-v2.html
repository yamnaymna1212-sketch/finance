<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --ink:#e4ded4; --gold:#e0b860; --red:#e5534b; --green:#4cc38a; --steel:#9fb4c8; }
  html,body { margin:0; background:#121212; }
  #stage { width:1080px; height:1920px; position:relative; overflow:hidden;
    background: radial-gradient(ellipse at 50% 58%, #1d1b17 0%, #141414 55%, #0e0e0e 100%); font-family:'Inter Display','Inter',sans-serif; }
  #world { position:absolute; left:0; top:0; width:1080px; height:1920px; transform-origin:0 0; }
  svg { position:absolute; left:0; top:0; overflow:visible; }
  .head { position:absolute; left:0; right:0; top:240px; text-align:center; color:var(--ink);
    font-weight:700; font-size:98px; line-height:1.06; letter-spacing:-1.5px; white-space:nowrap; }
  .gold { color:var(--gold); } .red { color:var(--red); } .green { color:var(--green); } .steel { color:var(--steel); }
  #flash, #fade { position:absolute; inset:0; opacity:0; pointer-events:none; }
  #flash { background:#fff; } #fade { background:#0b0b0b; }
  #vignette { position:absolute; inset:0; pointer-events:none; background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%); }
  .gG { filter: drop-shadow(0 0 8px rgba(224,184,96,.85)) drop-shadow(0 0 24px rgba(224,184,96,.45)); }
  .gR { filter: drop-shadow(0 0 8px rgba(229,83,75,.85)) drop-shadow(0 0 24px rgba(229,83,75,.4)); }
  .gN { filter: drop-shadow(0 0 8px rgba(76,195,138,.85)) drop-shadow(0 0 24px rgba(76,195,138,.4)); }
  .gS { filter: drop-shadow(0 0 8px rgba(159,180,200,.8)) drop-shadow(0 0 22px rgba(159,180,200,.35)); }
  .gB { filter: drop-shadow(0 0 8px rgba(111,183,255,.85)) drop-shadow(0 0 20px rgba(111,183,255,.4)); }
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <svg width="1080" height="1920" viewBox="0 0 1080 1920">
      <defs>
        <radialGradient id="glowGold"><stop offset="0" stop-color="#e0b860" stop-opacity=".26"/><stop offset="1" stop-color="#e0b860" stop-opacity="0"/></radialGradient>
        <radialGradient id="glowSteel"><stop offset="0" stop-color="#9fb4c8" stop-opacity=".22"/><stop offset="1" stop-color="#9fb4c8" stop-opacity="0"/></radialGradient>
        <radialGradient id="glowRed"><stop offset="0" stop-color="#e5534b" stop-opacity=".35"/><stop offset="1" stop-color="#e5534b" stop-opacity="0"/></radialGradient>
        <radialGradient id="glowGreen"><stop offset="0" stop-color="#4cc38a" stop-opacity=".33"/><stop offset="1" stop-color="#4cc38a" stop-opacity="0"/></radialGradient>
        <linearGradient id="liqGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecd08e"/><stop offset="1" stop-color="#8a6a2c"/></linearGradient>
        <linearGradient id="liqSteel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c3d3e2"/><stop offset="1" stop-color="#4f6478"/></linearGradient>
        <linearGradient id="barGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0d590"/><stop offset="1" stop-color="#7a5c22"/></linearGradient>
        <linearGradient id="barSteel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfdcea"/><stop offset="1" stop-color="#46596c"/></linearGradient>
        <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3122"/><stop offset=".55" stop-color="#1c1a16"/><stop offset="1" stop-color="#4a3c1e"/></linearGradient>
        <linearGradient id="chipGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3dca0"/><stop offset="1" stop-color="#a8843a"/></linearGradient>
        <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4cc38a" stop-opacity=".35"/><stop offset="1" stop-color="#4cc38a" stop-opacity="0"/></linearGradient>
        <linearGradient id="groundFade" x1="0" x2="1"><stop offset="0" stop-color="#ddd7cd" stop-opacity="0"/><stop offset=".15" stop-color="#ddd7cd" stop-opacity=".3"/><stop offset=".85" stop-color="#ddd7cd" stop-opacity=".3"/><stop offset="1" stop-color="#ddd7cd" stop-opacity="0"/></linearGradient>
        <clipPath id="bodyClip"><path d="M-20,-210 L-36,-18 H36 L20,-210 Z"/></clipPath>
        <g id="house" fill="none" stroke="#c9c3b8" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
          <rect x="-170" y="-270" width="340" height="270"/>
          <polyline points="-200,-262 0,-410 200,-262"/>
          <polyline points="100,-340 100,-392 134,-392 134,-312"/>
          <polyline points="-72,-145 0,-190 72,-145 -72,-145"/>
          <line x1="-62" y1="-145" x2="-62" y2="0"/><line x1="62" y1="-145" x2="62" y2="0"/>
          <rect x="-27" y="-118" width="54" height="118"/>
          <circle cx="16" cy="-58" r="3" fill="#e0b860" stroke="none"/>
          <rect x="-148" y="-208" width="62" height="72"/><path d="M-117,-208 V-136 M-148,-172 H-86"/>
          <rect x="86" y="-208" width="62" height="72"/><path d="M117,-208 V-136 M86,-172 H148"/>
          <path d="M-156,-136 H-78 M78,-136 H156" stroke-width="5"/>
          <circle cx="0" cy="-314" r="22"/>
          <path d="M-45,0 V10 H45 V0"/>
        </g>
        <g id="debtIcon">
          <g stroke="#e5534b" stroke-width="5" stroke-linejoin="round" fill="none">
            <path d="M-20,-62 Q-20,-86 0,-86 Q20,-86 20,-62"/>
            <path d="M-42,0 L-30,-62 H30 L42,0 Z" fill="#e5534b"/>
          </g>
          <text y="-22" text-anchor="middle" font-family="Inter" font-weight="800" font-size="19" letter-spacing="3" fill="#141414">DEBT</text>
        </g>
      </defs>
      <g id="W"></g>
    </svg>
  </div>
  <svg id="overlay" width="1080" height="1920"></svg>
  <div class="head" id="head"></div>
  <div id="flash"></div>
  <div id="fade"></div>
  <div id="vignette"></div>
</div>

<script>
/* ================= helpers ================= */
const NS='http://www.w3.org/2000/svg';
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,s,e)=>clamp((t-s)/(e-s));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const easeOut=x=>1-Math.pow(1-x,3);
const expo=x=>x>=1?1:1-Math.pow(2,-10*x);
const back=x=>{const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const popS=p=>p>0?back(p):0.001;
const lerp=(a,b,p)=>a+(b-a)*p;
const $=id=>document.getElementById(id);
const el=(tag,a,p)=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e;};
const txt=(p,s,a)=>{const e=el('text',Object.assign({'font-family':'Inter','font-weight':800},a),p);e.textContent=s;return e;};
const tf=(e,x,y,s=1,r=0)=>e.setAttribute('transform',`translate(${x},${y}) rotate(${r}) scale(${s})`);
const money=v=>'$'+Math.round(v).toLocaleString('en-US');
const W=$('W'), OV=$('overlay');
let seed=11; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;

/* ================= building blocks ================= */
function floor(y){ el('rect',{x:-1500,y,width:4000,height:1000,fill:'#0f0f0f'},W); el('rect',{x:-1500,y,width:4000,height:3,fill:'url(#groundFade)'},W); }
function glow(cx,cy,r,id){ return el('ellipse',{cx,cy,rx:r,ry:r,fill:`url(#${id})`},W); }
function flag(parent,x,y,side){
  const g=el('g',{transform:`translate(${x},${y})`},parent);
  el('line',{x1:0,y1:0,x2:0,y2:-400,stroke:'#c9c3b8','stroke-width':5,'stroke-linecap':'round'},g);
  el('circle',{cx:0,cy:-406,r:8,fill:'#e0b860',class:'gG'},g);
  const Wd=150,H=84,N=30,sw=Wd/N,sh=H/13,slices=[];
  for(let i=0;i<N;i++){ const s=el('g',{},g), x0=side*(i*sw)-(side<0?sw:0);
    for(let k=0;k<13;k++) el('rect',{x:x0,y:-398+k*sh,width:sw+.6,height:sh+.3,fill:k%2?'#efeae2':'#b8323a'},s);
    if(i<N*.42){ el('rect',{x:x0,y:-398,width:sw+.6,height:sh*7,fill:'#2f3d6b'},s);
      if(i%3===1) for(let r=0;r<5;r++) el('circle',{cx:x0+sw/2,cy:-392+r*9.6+(i%6===1?4.8:0),r:1.9,fill:'#fff'},s); }
    slices.push(s); }
  return {slices,N};
}
const FLAGS=[]; const waveAll=t=>FLAGS.forEach((f,j)=>f.slices.forEach((s,i)=>{const a=t*7+j*1.3-i*.42; s.setAttribute('transform',`translate(0,${Math.sin(a)*7*i/f.N})`); s.setAttribute('opacity',.82+.18*Math.cos(a));}));
function fence(x0,x1,y){const g=el('g',{stroke:'#6b675f','stroke-width':3.5,fill:'none'},W);for(let x=x0;x<=x1;x+=20)el('path',{d:`M${x},${y} V${y-34} L${x+5},${y-41} L${x+10},${y-34} V${y}`},g);el('path',{d:`M${x0-4},${y-24} H${x1+14} M${x0-4},${y-8} H${x1+14}`},g);}
function pill(label,color,w,parent=W){const g=el('g',{},parent);el('rect',{x:-w/2,y:-26,width:w,height:52,rx:26,fill:'#141414',stroke:color,'stroke-width':2.5},g);txt(g,label,{y:11,'text-anchor':'middle','font-size':28,'letter-spacing':7,fill:color});return g;}
function bigNum(s,color,cls){return txt(W,s,{'text-anchor':'middle','font-size':58,fill:color,class:cls,'font-family':'Inter Display',opacity:0});}

function buildChar(kind,dir){
  const color=kind==='owner'?'#e0b860':'#9fb4c8', liquid=kind==='owner'?'liqGold':'liqSteel';
  const root=el('g',{},W);
  el('ellipse',{cx:0,cy:3,rx:72,ry:10,fill:'#000','fill-opacity':.6},root);
  const rig=el('g',{},root);
  el('rect',{x:-50,y:-18,width:100,height:18,rx:4,fill:color,stroke:'#f1ece3','stroke-width':3},rig);
  el('path',{d:'M-20,-210 L-36,-18 H36 L20,-210 Z',fill:'#141414'},rig);
  const liq=el('rect',{x:-40,y:-18,width:80,height:0,fill:`url(#${liquid})`,'clip-path':'url(#bodyClip)'},rig);
  const liqTop=el('line',{x1:-36,x2:36,stroke:'#f6ecd2','stroke-opacity':.7,'stroke-width':2,'clip-path':'url(#bodyClip)'},rig);
  el('path',{d:'M-20,-210 L-36,-18 H36 L20,-210 Z',fill:'none',stroke:'#f1ece3','stroke-width':4,'stroke-linejoin':'round'},rig);
  if(kind==='owner') el('path',{d:'M-6,-210 L0,-150 L6,-210 Z',fill:'#e0b860'},rig);
  const armL=el('line',{stroke:'#f1ece3','stroke-width':4,'stroke-linecap':'round'},rig);
  const armR=el('line',{stroke:'#f1ece3','stroke-width':4,'stroke-linecap':'round'},rig);
  el('rect',{x:-30,y:-222,width:60,height:12,rx:3,fill:'#f1ece3'},rig);
  const head=el('g',{},rig);
  el('rect',{x:-6,y:-234,width:12,height:14,fill:'#f1ece3'},head);
  el('circle',{cx:0,cy:-272,r:38,fill:'#f1ece3'},head);
  if(kind==='renter') el('path',{d:'M-38,-286 Q-36,-314 0,-314 Q34,-314 38,-288 Z M30,-292 H62',fill:'#f1ece3',stroke:'#f1ece3','stroke-width':5,'stroke-linecap':'round'},head);
  const pupil=el('ellipse',{cx:0,cy:-272,rx:20,ry:20,fill:'#0d0d0d'},head);
  return {root,rig,liq,liqTop,armL,armR,head,pupil,dir};
}
function pose(c,x,y,t,o){
  o=Object.assign({level:.3,squash:1,sag:0,hop:0,swing:6,lift:0,liftR:0,lookX:c.dir,lookY:0,blink:1,shake:0,lean:0},o);
  const ph=x*.013+y*.001, breathe=1+.014*Math.sin(t*5+ph), sway=1.4*Math.sin(t*2.8+ph)+o.lean;
  c.root.setAttribute('transform',`translate(${x+o.shake},${y})`);
  c.rig.setAttribute('transform',`translate(0,${-o.hop}) rotate(${sway*(1-o.sag)}) scale(${1+(1-o.squash)*.6},${breathe*o.squash})`);
  const h=192*o.level, ly=-18-h; c.liq.setAttribute('y',ly); c.liq.setAttribute('height',h);
  c.liqTop.setAttribute('y1',ly+3*Math.sin(t*6)); c.liqTop.setAttribute('y2',ly-3*Math.sin(t*6));
  const sw=o.swing*Math.sin(t*4.4+ph), hy=-110+o.sag*40;
  c.armL.setAttribute('x1',-22);c.armL.setAttribute('y1',-200);c.armL.setAttribute('x2',-50-sw-o.lift*.6);c.armL.setAttribute('y2',hy-o.lift);
  c.armR.setAttribute('x1',22);c.armR.setAttribute('y1',-200);c.armR.setAttribute('x2',50-sw+(o.lift+o.liftR)*.6);c.armR.setAttribute('y2',hy-o.lift-o.liftR);
  c.head.setAttribute('transform',`translate(0,${o.sag*14+2*Math.sin(t*5+ph)})`);
  c.pupil.setAttribute('cx',8*o.lookX); c.pupil.setAttribute('cy',-272+8*o.lookY+o.sag*6); c.pupil.setAttribute('ry',20*o.blink);
}
const blink=(t,ts)=>{for(const b of ts){const p=(t-b)/.14;if(p>=0&&p<=1)return .12+.88*Math.abs(1-2*p);}return 1;};
const hopAt=(t,s,d=.45,h=32)=>{const p=prog(t,s,s+d);return p>0&&p<1?Math.sin(p*Math.PI)*h:0;};

/* icons */
function dollarBill(parent){const g=el('g',{class:'gN'},parent);
  el('rect',{x:-80,y:-38,width:160,height:76,rx:6,fill:'#18201a',stroke:'#8fbf8a','stroke-width':3},g);
  el('rect',{x:-70,y:-29,width:140,height:58,rx:4,fill:'none',stroke:'#8fbf8a','stroke-width':1.5,'stroke-opacity':.7},g);
  el('ellipse',{cx:0,cy:0,rx:20,ry:24,fill:'none',stroke:'#8fbf8a','stroke-width':2.5},g);
  txt(g,'$',{y:8,'text-anchor':'middle','font-size':24,fill:'#8fbf8a'});
  [[-56,-14],[56,-14],[-56,22],[56,22]].forEach(([x,y])=>txt(g,'1',{x,y,'text-anchor':'middle','font-size':16,fill:'#8fbf8a'})); return g;}
function check(){const g=el('g',{},W);
  el('rect',{x:-210,y:-95,width:420,height:190,rx:8,fill:'#ece6d8',stroke:'#cfc6b2','stroke-width':2},g);
  el('rect',{x:-210,y:-95,width:420,height:22,rx:8,fill:'#d9e4d2'},g);
  txt(g,'No. 1042',{x:190,y:-52,'text-anchor':'end','font-size':14,fill:'#6b6559','font-weight':600});
  txt(g,'PAY TO THE ORDER OF',{x:-190,y:-22,'font-size':12,fill:'#6b6559','font-weight':700,'letter-spacing':1});
  txt(g,'Landlord',{x:-40,y:-20,'font-size':28,fill:'#24324f','font-style':'italic','font-weight':600,'font-family':'Inter'});
  el('line',{x1:-48,y1:-14,x2:90,y2:-14,stroke:'#8d8676','stroke-width':1.5},g);
  el('rect',{x:105,y:-44,width:90,height:36,rx:4,fill:'#fff',stroke:'#8d8676','stroke-width':1.5},g);
  txt(g,'$2,200.00',{x:150,y:-19,'text-anchor':'middle','font-size':17,fill:'#24324f'});
  txt(g,'Two thousand two hundred and 00/100',{x:-190,y:22,'font-size':15,fill:'#24324f','font-style':'italic','font-weight':500});
  el('line',{x1:-190,y1:28,x2:150,y2:28,stroke:'#8d8676','stroke-width':1.5},g);
  txt(g,'DOLLARS',{x:192,y:28,'text-anchor':'end','font-size':11,fill:'#6b6559'});
  el('path',{d:'M40,62 C55,40 62,70 75,52 S95,70 108,50 S130,66 150,56',fill:'none',stroke:'#24324f','stroke-width':2.5},g);
  el('line',{x1:30,y1:70,x2:190,y2:70,stroke:'#8d8676','stroke-width':1.5},g);
  txt(g,'⑆021000021⑆ 4417 1042',{x:-190,y:84,'font-size':14,fill:'#4a4538','font-family':'DejaVu Sans Mono','font-weight':400});
  return g;}
function apartment(){const g=el('g',{},W);
  el('rect',{x:-150,y:-520,width:300,height:520,fill:'#141414',stroke:'#c9c3b8','stroke-width':3.5},g);
  el('path',{d:'M-165,-520 H165 M-120,-520 V-548 H120 V-520',fill:'none',stroke:'#c9c3b8','stroke-width':3.5},g);
  const wins=[]; for(let r=0;r<6;r++)for(let c=0;c<4;c++) wins.push(el('rect',{x:-118+c*62,y:-490+r*70,width:40,height:44,fill:'#141414',stroke:'#6b675f','stroke-width':2.5},g));
  el('rect',{x:-30,y:-70,width:60,height:70,fill:'none',stroke:'#c9c3b8','stroke-width':3.5},g);
  return {g,wins};}
function pipe(){const g=el('g',{},W);
  el('path',{d:'M-260,0 H-20 M20,0 H200 V180',fill:'none',stroke:'#6b675f','stroke-width':22,'stroke-linecap':'butt'},g);
  el('path',{d:'M-260,0 H-20 M20,0 H200 V180',fill:'none',stroke:'#8b877f','stroke-width':6,'stroke-opacity':.6},g);
  el('rect',{x:-34,y:-18,width:24,height:36,rx:3,fill:'#8b877f'},g); el('rect',{x:10,y:-18,width:24,height:36,rx:3,fill:'#8b877f'},g);
  return g;}
function waterSet(n){const a=[];for(let i=0;i<n;i++)a.push({e:el('path',{d:'M0,-12 Q8,0 0,6 Q-8,0 0,-12 Z',fill:'#6fb7ff',class:'gB'},W),dx:(rnd()-.5)*50,sp:.5+rnd()*.5,ph:rnd()});return a;}
function wrench(parent){const g=el('g',{class:'gN'},parent);el('path',{d:'M-46,46 L10,-10 M10,-10 a26,26 0 1 1 30,-30 l-18,4 -4,18 z',fill:'none',stroke:'#4cc38a','stroke-width':9,'stroke-linecap':'round','stroke-linejoin':'round'},g);return g;}
function checkMark(parent){const g=el('g',{class:'gN'},parent);el('circle',{r:56,fill:'#10241a',stroke:'#4cc38a','stroke-width':6},g);const p=el('path',{d:'M-24,2 L-6,20 L28,-18',fill:'none',stroke:'#4cc38a','stroke-width':10,'stroke-linecap':'round','stroke-linejoin':'round',pathLength:1,'stroke-dasharray':'1 1'},g);return {g,p};}
function wallet(){const g=el('g',{},W);
  el('rect',{x:-50,y:-30,width:100,height:64,rx:10,fill:'#1a1a1a',stroke:'#c9c3b8','stroke-width':3.5},g);
  const cash=el('rect',{x:-36,y:-44,width:72,height:30,rx:3,fill:'#18201a',stroke:'#8fbf8a','stroke-width':2.5},g);
  el('path',{d:'M-50,-6 H20 Q36,-6 36,10 Q36,24 20,24 H-50',fill:'#1a1a1a',stroke:'#c9c3b8','stroke-width':3.5},g);
  el('circle',{cx:20,cy:9,r:5,fill:'#e0b860'},g); return {g,cash};}
function spCard(){const g=el('g',{},W);
  el('rect',{x:-240,y:-180,width:480,height:360,rx:22,fill:'#131313',stroke:'#3d3a34','stroke-width':2.5},g);
  txt(g,'S&P 500',{x:-205,y:-118,'font-size':50,fill:'#f1ece3','font-family':'Inter Display','letter-spacing':-0.5});
  txt(g,'INDEX FUND',{x:-205,y:-84,'font-size':18,fill:'#8b877f','letter-spacing':5});
  const tick=txt(g,'▲',{x:205,y:-118,'text-anchor':'end','font-size':34,fill:'#4cc38a',class:'gN'});
  for(let i=0;i<4;i++) el('line',{x1:-205,y1:-40+i*50,x2:205,y2:-40+i*50,stroke:'#262420','stroke-width':1.5},g);
  const pts=[]; let y=130; for(let i=0;i<=40;i++){ y-= 5.2 + (Math.sin(i*1.7)*9) + (i%9===4?-16:0); pts.push([-205+i*410/40, Math.max(-60,y)]); }
  const d='M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');
  const area=el('path',{d:d+' L205,150 L-205,150 Z',fill:'url(#chartFill)',opacity:0},g);
  const line=el('path',{d,fill:'none',stroke:'#4cc38a','stroke-width':4.5,'stroke-linejoin':'round',pathLength:1,'stroke-dasharray':'1 1',class:'gN'},g);
  const dot=el('circle',{r:8,fill:'#bff0d6',class:'gN'},g);
  return {g,area,line,dot,pts,tick};}
function keys(){const g=el('g',{class:'gG'},W);
  el('circle',{r:26,fill:'none',stroke:'#e0b860','stroke-width':5},g);
  [[-1,0],[1,40]].forEach(([s,r])=>{const k=el('g',{transform:`rotate(${r})`},g);
    el('circle',{cx:0,cy:52,r:18,fill:'none',stroke:'#e0b860','stroke-width':5},k);
    el('path',{d:'M0,70 V140 M0,112 H14 M0,128 H12',fill:'none',stroke:'#e0b860','stroke-width':5,'stroke-linecap':'round'},k);});
  return g;}
function cashStack(){const g=el('g',{class:'gN'},W);
  for(let i=2;i>=0;i--){el('rect',{x:-80+i*6,y:-38-i*12,width:160,height:76,rx:6,fill:'#18201a',stroke:'#8fbf8a','stroke-width':3},g);}
