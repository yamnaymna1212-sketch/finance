<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#0b0b0c; --gold:#e8b931; --rent:#4da3ff; --ash:#8a8f98; --line:#e9e6df; --red:#e5484d; }
  html,body { margin:0; background:var(--bg); }
  #stage { width:1080px; height:1920px; position:relative; overflow:hidden; transform-origin:50% 60%;
    background: radial-gradient(ellipse at 50% 58%, #1c1913 0%, #0b0b0c 62%); font-family:'Inter Display','Inter',sans-serif; }
  .hook { position:absolute; left:0; right:0; text-align:center; font-weight:800; letter-spacing:-1px; color:#fff; white-space:nowrap; font-size:90px; }
  #h1 { top:250px; } #h2 { top:365px; }
  .gold { color:var(--gold); } .red { color:var(--red); } .blue { color:var(--rent); }
  #tag { position:absolute; top:150px; left:50%; transform:translateX(-50%); border:2px solid #4a4436;
    color:#a8996c; font:700 26px 'Inter',sans-serif; letter-spacing:6px; padding:10px 26px; border-radius:40px; white-space:nowrap; }
  #year { position:absolute; top:540px; left:0; right:0; text-align:center; color:#fff; font:800 72px 'Inter Display'; }
  #year small { display:block; font:600 24px 'Inter'; letter-spacing:8px; color:var(--ash); margin-bottom:4px; }
  .cap { position:absolute; top:1745px; left:0; right:0; text-align:center; color:#6f6c66; font:800 44px 'Inter Display'; letter-spacing:1px; }
  .cap b { color:#fff; } .cap .gold { color:var(--gold); }
  #brand { position:absolute; bottom:36px; left:0; right:0; text-align:center; color:var(--gold); opacity:.5; font:700 24px 'Inter'; letter-spacing:10px; }
  svg { position:absolute; left:0; top:0; }
  .draw { fill:none; stroke:var(--line); stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
</style>
</head>
<body>
<div id="stage">
  <div id="tag">CASE FILE 001 · RENT VS OWN</div>
  <div class="hook" id="h1">THE OWNER IS <span class="red">BROKE.</span></div>
  <div class="hook" id="h2">THE RENTER <span class="gold">ISN'T.</span></div>
  <div id="year"><small>YEAR</small><span id="yearNum">0</span></div>

  <svg width="1080" height="1920" viewBox="0 0 1080 1920">
    <defs>
      <radialGradient id="glowBlue"><stop offset="0" stop-color="#4da3ff" stop-opacity=".45"/><stop offset="1" stop-color="#4da3ff" stop-opacity="0"/></radialGradient>
      <radialGradient id="glowGold"><stop offset="0" stop-color="#e8b931" stop-opacity=".45"/><stop offset="1" stop-color="#e8b931" stop-opacity="0"/></radialGradient>
      <linearGradient id="fillBlue" x1="0" y1="0" x2="0" y2="1"><stop offset=".35" stop-color="#4da3ff" stop-opacity="0"/><stop offset="1" stop-color="#4da3ff"/></linearGradient>
      <linearGradient id="fillGold" x1="0" y1="0" x2="0" y2="1"><stop offset=".35" stop-color="#e8b931" stop-opacity="0"/><stop offset="1" stop-color="#e8b931"/></linearGradient>
      <g id="house">
        <rect class="draw" x="-190" y="-300" width="380" height="300"/>
        <polyline class="draw" points="-225,-290 0,-460 225,-290"/>
        <polyline class="draw" points="110,-380 110,-440 150,-440 150,-350"/>
        <polyline class="draw" points="-80,-160 0,-210 80,-160 -80,-160"/>
        <line class="draw" x1="-70" y1="-160" x2="-70" y2="0"/>
        <line class="draw" x1="70" y1="-160" x2="70" y2="0"/>
        <rect class="draw" x="-30" y="-130" width="60" height="130"/>
        <rect class="draw" x="-165" y="-230" width="70" height="80"/>
        <path class="draw" d="M-130,-230 V-150 M-165,-190 H-95"/>
        <rect class="draw" x="95" y="-230" width="70" height="80"/>
        <path class="draw" d="M130,-230 V-150 M95,-190 H165"/>
        <circle class="draw" cx="0" cy="-350" r="26"/>
        <path class="draw" d="M-45,0 V12 H45 V0"/>
      </g>
    </defs>

    <!-- street -->
    <line class="draw" x1="40" y1="1420" x2="1040" y2="1420"/>
    <line x1="40" y1="1600" x2="1040" y2="1600" stroke="#3a3833" stroke-width="4"/>
    <g stroke="#2e2c28" stroke-width="5" stroke-linecap="round">
      <line x1="80" y1="1690" x2="160" y2="1690"/><line x1="240" y1="1690" x2="320" y2="1690"/>
      <line x1="400" y1="1690" x2="480" y2="1690"/><line x1="560" y1="1690" x2="640" y2="1690"/>
      <line x1="720" y1="1690" x2="800" y2="1690"/><line x1="880" y1="1690" x2="960" y2="1690"/>
    </g>
    <!-- walkways from door to sidewalk -->
    <path d="M250,1432 L225,1600 M300,1432 L325,1600 M780,1432 L755,1600 M830,1432 L855,1600" stroke="#2e2c28" stroke-width="4" fill="none"/>

    <g transform="translate(275,1420) scale(1.08)"><use href="#house"/></g>
    <g transform="translate(805,1420) scale(1.08)"><use href="#house"/></g>

    <!-- fence + mailbox -->
    <path d="M40,1420 V1385 M60,1420 V1385 M80,1420 V1385 M30,1395 H90 M1000,1420 V1385 M1020,1420 V1385 M1040,1420 V1385 M990,1395 H1050 M520,1420 V1360 M500,1360 H540 V1335 H500 Z" stroke="#5a5750" stroke-width="4" fill="none"/>

    <!-- labels -->
    <g id="labelL" transform="translate(275,850)">
      <rect x="-125" y="-50" width="250" height="90" rx="45" fill="#4da3ff"/>
      <text x="0" y="16" text-anchor="middle" font-family="Inter Display" font-weight="800" font-size="50" fill="#0b0b0c" letter-spacing="6">RENT</text>
    </g>
    <g id="labelR" transform="translate(805,850)">
      <rect x="-145" y="-50" width="290" height="90" rx="45" fill="#e8b931"/>
      <text x="0" y="16" text-anchor="middle" font-family="Inter Display" font-weight="800" font-size="50" fill="#0b0b0c" letter-spacing="6">OWNER</text>
    </g>

    <!-- characters: slim pawn with head + eye, like the reference style -->
    <g id="pawnL" transform="translate(215,1600)">
      <ellipse cx="0" cy="0" rx="120" ry="34" fill="url(#glowBlue)"/>
      <g id="bodyL">
        <path d="M-16,-190 L-30,-24 H30 L16,-190 Z" fill="url(#fillBlue)" stroke="#4da3ff" stroke-width="5" stroke-linejoin="round"/>
        <path d="M-28,-190 H28" stroke="#4da3ff" stroke-width="6" stroke-linecap="round"/>
        <rect x="-42" y="-24" width="84" height="20" rx="5" fill="#4da3ff"/>
        <circle cx="0" cy="-228" r="32" fill="#0b0b0c" stroke="#4da3ff" stroke-width="5"/>
        <circle cx="-6" cy="-228" r="11" fill="#4da3ff"/>
      </g>
    </g>
    <g id="pawnR" transform="translate(865,1600)">
      <ellipse cx="0" cy="0" rx="120" ry="34" fill="url(#glowGold)"/>
      <g id="bodyR">
        <path d="M-16,-190 L-30,-24 H30 L16,-190 Z" fill="url(#fillGold)" stroke="#e8b931" stroke-width="5" stroke-linejoin="round"/>
        <path d="M-28,-190 H28" stroke="#e8b931" stroke-width="6" stroke-linecap="round"/>
        <rect x="-42" y="-24" width="84" height="20" rx="5" fill="#e8b931"/>
        <circle cx="0" cy="-228" r="32" fill="#0b0b0c" stroke="#e8b931" stroke-width="5"/>
        <circle cx="6" cy="-228" r="11" fill="#e8b931"/>
      </g>
    </g>

    <!-- renter's savings jar -->
    <g id="jar" transform="translate(345,1600)">
      <clipPath id="jarClip"><path d="M-36,-100 H36 V-8 Q36,0 28,0 H-28 Q-36,0 -36,-8 Z"/></clipPath>
      <rect id="jarFill" x="-40" y="0" width="80" height="0" fill="#e8b931" clip-path="url(#jarClip)"/>
      <path d="M-36,-100 H36 V-8 Q36,0 28,0 H-28 Q-36,0 -36,-8 Z M-42,-112 H42 V-100 H-42 Z" fill="none" stroke="#e8b931" stroke-width="5"/>
    </g>

    <!-- owner's debt weight -->
    <g id="debt" transform="translate(730,1600)">
      <g id="debtInner">
        <path d="M-60,0 L-45,-90 H45 L60,0 Z" fill="#e5484d"/>
        <path d="M-22,-90 Q-22,-120 0,-120 Q22,-120 22,-90" fill="none" stroke="#e5484d" stroke-width="10"/>
        <text x="0" y="-32" text-anchor="middle" font-family="Inter" font-weight="800" font-size="24" fill="#0b0b0c" letter-spacing="2">DEBT</text>
      </g>
    </g>
  </svg>

  <div class="cap" id="cap1"><b>SAME</b> HOUSE. <b>SAME</b> STREET.</div>
  <div class="cap" id="cap2">ONE PAYS <b class="blue">RENT</b>. ONE <span class="gold">OWNS</span>.</div>
  <div id="brand">THE GOLD MIND</div>
</div>

<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,s,e)=>clamp((t-s)/(e-s));
const easeOut=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const $=id=>document.getElementById(id);

window.render = function(t){
  // Frame 0: full scene + hook line 1 already on screen. Small punch on the hook.
  $('h1').style.transform=`scale(${1.06-0.06*easeOut(prog(t,0,0.2))})`;
  const h2=prog(t,1.2,1.4); $('h2').style.opacity=h2>0?1:0; $('h2').style.transform=`scale(${1.06-0.06*easeOut(h2)})`;

  // idle bob on labels and characters
  $('labelL').setAttribute('transform',`translate(275,${850+6*Math.sin(t*3)})`);
  $('labelR').setAttribute('transform',`translate(805,${850+6*Math.sin(t*3+1.6)})`);
  $('bodyL').setAttribute('transform',`translate(0,${-4*Math.abs(Math.sin(t*2.4))})`);

  // captions
  $('cap1').style.opacity = t<2.2 ? 1 : 0;
  $('cap2').style.opacity = t>=2.2 ? 1 : 0;

  // debt drops on owner at 2.4s, owner sinks
  const dp=prog(t,2.4,2.75); const dy=-900*(1-dp*dp);
  const squash = dp>=1 ? 1-0.14*Math.max(0,1-prog(t,2.75,3.05)) : 1;
  const growD = 1+0.4*easeOut(prog(t,3.4,6));
  $('debt').setAttribute('transform',`translate(730,${1600+dy})`);
  $('debt').setAttribute('opacity',dp>0?1:0);
  $('debtInner').setAttribute('transform',`scale(${growD*(2-squash)},${growD*squash})`);
  const sink = 16*easeOut(prog(t,2.7,3.1));
  $('bodyR').setAttribute('transform',`translate(0,${sink}) scale(1,${1-sink/260})`);

  // renter's jar fills
  const jp=prog(t,2.5,2.8); $('jar').setAttribute('opacity',jp>0?1:0);
  $('jar').setAttribute('transform',`translate(345,1600) scale(${jp>0?back(jp):0.001})`);
  const fill = 92*easeOut(prog(t,3.0,6));
  $('jarFill').setAttribute('y',-fill); $('jarFill').setAttribute('height',fill);

  // year counter
  $('year').style.opacity=prog(t,3.0,3.3);
  $('yearNum').textContent = Math.floor(10*prog(t,3.3,5.9));

  // slow push-in
  $('stage').style.transform=`scale(${1+0.03*prog(t,0,6)})`;
};
window.render(0);
</script>
</body>
</html>
